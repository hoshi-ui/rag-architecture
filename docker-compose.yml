version: '3.8'

services:
  # ==================== 向量数据库 ====================
  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.4.17}
    container_name: milvus-standalone
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MILVUS_PATH: /var/lib/milvus
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - rag-network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G
    depends_on:
      - etcd
      - minio

  # Etcd for Milvus
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    command: >
      /usr/local/bin/etcd
      --data-dir=/etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --initial-advertise-peer-urls=http://etcd:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-cluster=default=http://etcd:2380
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    networks:
      - rag-network
    restart: unless-stopped

  # MinIO for Milvus
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    container_name: milvus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - rag-network
    restart: unless-stopped

  # ==================== 嵌入服务 ====================
  embedding-service:
    build:
      context: ./services/embedding
      dockerfile: Dockerfile
    container_name: embedding-service
    environment:
      - MODEL_NAME=${EMBEDDING_MODEL_NAME:-/models/BAAI/bge-m3}
      - MAX_LENGTH=${EMBEDDING_MAX_LENGTH:-8192}
      - BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - SERVICE_PORT=${EMBEDDING_SERVICE_PORT:-8000}
      - ENABLE_SPARSE_EMBEDDING=${ENABLE_SPARSE_EMBEDDING:-true}
      - BGE_M3_USE_FP16=${BGE_M3_USE_FP16:-true}
    volumes:
      - ${LOCAL_MODELS_DIR:-./local-models}:/models
      - embedding_cache:/cache
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${EMBEDDING_GPU_COUNT:-1}
              capabilities: [gpu]
    ports:
      - "${EMBEDDING_HOST_PORT:-8001}:${EMBEDDING_SERVICE_PORT:-8000}"

  # ==================== 重排序服务 ====================
  rerank-service:
    build:
      context: ./services/rerank
      dockerfile: Dockerfile
    container_name: rerank-service
    environment:
      - MODEL_NAME=${RERANK_MODEL_NAME:-/models/BAAI/bge-reranker-base}
      - MAX_LENGTH=${RERANK_MAX_LENGTH:-512}
      - BATCH_SIZE=${RERANK_BATCH_SIZE:-16}
      - SERVICE_PORT=${RERANK_SERVICE_PORT:-8000}
      - RERANK_DEFAULT_TOP_N=${RERANK_DEFAULT_TOP_N:-10}
    volumes:
      - ${LOCAL_MODELS_DIR:-./local-models}:/models
    networks:
      - rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${RERANK_GPU_COUNT:-1}
              capabilities: [gpu]
    ports:
      - "${RERANK_HOST_PORT:-8002}:${RERANK_SERVICE_PORT:-8000}"

  # ==================== 应用服务 ====================
  rag-app:
    build:
      context: ./services/rag-app
      dockerfile: Dockerfile
    container_name: rag-app
    env_file:
      - ${RAG_APP_ENV_FILE:-./config/app.env}
    environment:
      RAG_DATABASE_DIR: /database
      SQLITE_BUSY_TIMEOUT_SEC: "60"
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      WAIT_FOR_MILVUS: ${WAIT_FOR_MILVUS:-true}
      MILVUS_CONNECT_TIMEOUT_SEC: ${MILVUS_CONNECT_TIMEOUT_SEC:-180}
      MILVUS_CONNECT_RETRY_INTERVAL_SEC: ${MILVUS_CONNECT_RETRY_INTERVAL_SEC:-2}
    volumes:
      - ./config:/app/config
      - ./database:/database
      - ./logs:/app/logs
      - ./evals:/app/evals
      - ./reports:/app/reports
      - ./ocr-bridge:/ocr-bridge
      - rag_storage:/storage
    ports:
      - "${APP_HOST_PORT:-8080}:${APP_PORT:-8080}"
    extra_hosts:
      - "${HOST_GATEWAY_NAME:-host.docker.internal}:${HOST_GATEWAY_IP:-host-gateway}"
    networks:
      - rag-network
    depends_on:
      - milvus
      - embedding-service
      - rerank-service
    restart: unless-stopped

  # ==================== 缓存服务 ====================
  # ==================== Ollama (本地 LLM) ====================
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.9.0}
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-1}
              capabilities: [gpu]
    networks:
      - rag-network

  # ==================== 监控服务 ====================

volumes:
  milvus_data:
  etcd_data:
  minio_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  embedding_cache:
  rag_storage:

networks:
  rag-network:
    driver: bridge
